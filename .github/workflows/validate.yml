name: Validate Waves App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check waves-data.js
          node --check textbook.js
          node --check textbook-data.js
          node --check advanced-features.js
          node --check integration-patches.js
          node --check textbook-expansion.js
          node --check simulation-upgrades-v2.js
          node --check simulation-upgrades-v3.js
          node --check simulation-upgrades-v4.js
          node --check simulation-performance-v6.js
          node --check simulation-visuals-v7.js
          node --check fibre-pulse-final-v13.js
          node --check lesson-depth-v15.js
          node --check simulations-3d-v16.js
          node --check textbook-interactives-v3.js
          node --check question-engine-v3.js
          node --check extended-response-v4.js
          node --check topic-end-practice-v5.js
          node --check equation-coach-v6.js
          node --check learning-depth-v6.js
          node --check lesson-expansion-v7.js
          node --check sw.js
      - name: Check required app files
        run: |
          test -f index.html
          test -f styles.css
          test -f advanced-features.css
          test -f detail-upgrades.css
          test -f course-upgrades-v3.css
          test -f extended-response-v4.css
          test -f learning-upgrades-v5.css
          test -f learning-v6.css
          test -f visual-polish-v7.css
          test -f simulation-hud-v7.css
          test -f fibre-pulse-final-v13.css
          test -f lesson-depth-v15.css
          test -f simulations-3d-v15.css
          test -f simulation-upgrades-v3.js
          test -f simulation-upgrades-v4.js
          test -f simulation-performance-v6.js
          test -f simulation-visuals-v7.js
          test -f fibre-pulse-final-v13.js
          test -f lesson-depth-v15.js
          test -f simulations-3d-v16.js
          test -f textbook-interactives-v3.js
          test -f question-engine-v3.js
          test -f extended-response-v4.js
          test -f topic-end-practice-v5.js
          test -f equation-coach-v6.js
          test -f learning-depth-v6.js
          test -f lesson-expansion-v7.js
          test -f manifest.webmanifest